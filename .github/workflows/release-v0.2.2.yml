name: Validate and Release v0.2.2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.2.2.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest

      - name: Create v0.2.2 tag
        shell: bash
        run: |
          set -euo pipefail
          git tag v0.2.2 "$GITHUB_SHA"
          git push origin refs/tags/v0.2.2

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v0.2.2 \
            --title "AI_Actuator v0.2.2" \
            --notes "Optimistic-concurrency safety release: local_read_text_file returns full-file SHA-256; local_edit_text_file and overwrite operations support expected_sha256; stale state is rejected with structured file_changed errors before mutation; backups are taken from the exact checked snapshot; audit metadata records expected/before/after hashes. Retains v0.2.1 backup, rollback, audit, split 8765/8766 architecture, Bearer auth, trusted roots, and Cloudflare Quick Tunnel support."
