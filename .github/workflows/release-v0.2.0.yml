name: Publish v0.2.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.2.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: 08c3006f8a6ce22c9b020ec77a2a55a6ddca39bf
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo "v0.2.0 already exists; nothing to do."
            exit 0
          fi
          gh release create v0.2.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_COMMIT" \
            --title "AI_Actuator v0.2.0" \
            --notes "AI_Actuator v0.2.0 opens the 0.2.x development line. Version metadata and changelog are synchronized to 0.2.0. Current functionality remains the secure local MCP foundation; remote MCP / Cloudflare Tunnel is planned but not yet implemented in this release."
