name: Publish corrected v0.2.0

on:
  push:
    branches:
      - release-helper-v020
    paths:
      - .github/workflows/release-v0.2.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish corrected tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: 8948dbbb4899d52f22cd3ebd052aa5feda8f3320
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.2.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_COMMIT" \
            --title "AI_Actuator v0.2.0" \
            --notes "Corrected v0.2.0 synchronized with the completed AI_Actuator chat implementation. Admin is local-only on 127.0.0.1:8765, MCP is on 127.0.0.1:8766, /health is on 8766, non-MCP paths on the MCP port return 404, and Bearer authentication remains required for /mcp. Cloudflare remote exposure itself is not included yet."
