name: Validate and Tag v0.2.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.2.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" httpx

      - name: Run test suite
        run: python -m pytest

      - name: Restore corrected v0.2.0 tag
        env:
          TARGET_COMMIT: 4226d6e2aea06ae0ba14e74eee887f4055da4928
        shell: bash
        run: |
          set -euo pipefail
          git tag -f v0.2.0 "$TARGET_COMMIT"
          git push --force origin refs/tags/v0.2.0
