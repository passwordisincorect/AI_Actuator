name: Validate and Release v0.2.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.2.1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest

      - name: Create v0.2.1 tag
        shell: bash
        run: |
          set -euo pipefail
          git tag v0.2.1 "$GITHUB_SHA"
          git push origin refs/tags/v0.2.1

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v0.2.1 \
            --title "AI_Actuator v0.2.1" \
            --notes "Safety hardening release: automatic backup before overwrite/edit, rollback with a safety snapshot, append-only audit logging, SHA-256 backup integrity checks, and the new local_list_backups, local_rollback_text_file, and local_read_audit_log MCP tools. Retains the split 8765/8766 architecture and built-in Cloudflare Quick Tunnel remote MCP support."
