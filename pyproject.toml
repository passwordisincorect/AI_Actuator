[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-actuator"
version = "0.1.2"
description = "A security-focused local MCP filesystem bridge for Windows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "starlette>=0.47,<1",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.15,<7",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
ai-actuator = "ai_actuator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

